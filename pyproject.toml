[project]
name = "discord-event"
version = "0.1.1"
description = "The Iron Foundry - Event management Discord bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncio>=4.0.0",
    "discord-py>=2.7.1",
    "dotenv>=0.9.9",
    "loguru>=0.7.3",
    "pydantic>=2.12.3",
    "pymongo>=4.15.3",
    "pytest>=9.0.3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PLE",
    "ASYNC", "DTZ", "LOG", "G", "C4", "RET", "PERF", "PTH", "S",
]
allowed-confusables = ["×", "➕", "➖", "’"]

[tool.ruff.lint.per-file-ignores]
# StrEnum of environment variable names, not credential values.
"core/config.py" = ["S105"]
